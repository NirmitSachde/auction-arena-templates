<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 11 Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Spotlight: dark arena, volumetric cone on the player, scoreboard bid. */
div[data-bind] { display: block; }
:root {
  --ink: #f6f1e7;
  --mute: rgba(246,241,231,.55);
  --warm: #ffd27a;
  --amber: #ffb02e;
  --line: rgba(255,220,160,.16);
  --disp: "Bebas Neue", "Oswald", Impact, sans-serif;
  --cond: "Oswald", "Bebas Neue", sans-serif;
  --sans: "Inter", system-ui, sans-serif;
}
.aa-stage {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(900px 260px at 50% 1010px, rgba(255,200,110,.20), transparent 70%),
    radial-gradient(1400px 900px at 50% 40%, #16110c 0%, #07060a 60%, #030305 100%);
}
/* arena rim lights */
.rim { position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(260px 90px at 10% 0, rgba(255,210,140,.18), transparent 70%),
    radial-gradient(260px 90px at 90% 0, rgba(255,210,140,.18), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 2px, transparent 2px 120px);
}
/* volumetric cone */
.cone { position: absolute; left: 50%; top: -60px; width: 1100px; height: 1080px; transform: translateX(-50%); pointer-events: none;
  background: linear-gradient(180deg, rgba(255,236,196,.42), rgba(255,220,160,.12) 55%, rgba(255,210,140,0) 90%);
  clip-path: polygon(44% 0, 56% 0, 88% 100%, 12% 100%);
  filter: blur(18px); mix-blend-mode: screen; animation: breathe 6s ease-in-out infinite; }
.cone.inner { width: 700px; background: linear-gradient(180deg, rgba(255,246,222,.55), rgba(255,230,180,.08) 70%, transparent); filter: blur(10px); }
@keyframes breathe { 50% { opacity: .82; } }
.lamp { position: absolute; left: 50%; top: -30px; width: 180px; height: 60px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, #fff8e6, rgba(255,220,150,.6) 40%, transparent); filter: blur(4px); }
.floor { position: absolute; left: 50%; top: 700px; width: 900px; height: 150px; transform: translateX(-50%); border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255,226,170,.40), rgba(255,200,120,.12) 55%, transparent); }
/* dust particles */
.dust { position: absolute; left: 50%; top: 0; width: 700px; height: 820px; transform: translateX(-50%); pointer-events: none;
  clip-path: polygon(40% 0, 60% 0, 92% 100%, 8% 100%);
  background-image:
    radial-gradient(1.6px 1.6px at 12% 22%, rgba(255,240,210,.9), transparent),
    radial-gradient(1.2px 1.2px at 30% 64%, rgba(255,240,210,.7), transparent),
    radial-gradient(2px 2px at 48% 38%, rgba(255,240,210,.8), transparent),
    radial-gradient(1.2px 1.2px at 64% 12%, rgba(255,240,210,.7), transparent),
    radial-gradient(1.6px 1.6px at 78% 52%, rgba(255,240,210,.8), transparent),
    radial-gradient(1px 1px at 88% 80%, rgba(255,240,210,.6), transparent),
    radial-gradient(1.4px 1.4px at 22% 88%, rgba(255,240,210,.6), transparent),
    radial-gradient(1px 1px at 56% 76%, rgba(255,240,210,.7), transparent);
  background-size: 260px 300px; animation: drift 22s linear infinite; opacity: .8; }
.dust.b { background-size: 190px 230px; animation-duration: 34s; opacity: .5; animation-direction: reverse; }
@keyframes drift { to { background-position: 60px 600px; } }

.lbl { font-family: var(--cond); font-size: 18px; font-weight: 500; letter-spacing: .24em; text-transform: uppercase; color: var(--mute); }

/* top bar */
.top { position: absolute; left: 60px; right: 60px; top: 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; z-index: 3; }
.tour { display: flex; align-items: center; gap: 18px; }
.tour img { width: 68px; height: 68px; }
.tour-n { font-family: var(--cond); font-size: 30px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
.tour-s { margin-top: 6px; font-size: 16px; }
.brand img { width: 96px; height: 80px; object-fit: contain; opacity: .95; }
.spon { justify-self: end; display: flex; align-items: center; gap: 18px; text-align: right; }
.spon img { height: 62px; width: 166px; object-fit: contain; }
.spon .n { font-family: var(--cond); font-size: 26px; font-weight: 600; margin-top: 4px; }

/* player */
.player { position: absolute; left: 50%; top: 150px; width: 560px; height: 600px; transform: translateX(-50%); z-index: 2; }
.player img { width: 100%; height: 100%; object-fit: contain; object-position: bottom;
  filter: drop-shadow(0 -6px 30px rgba(255,220,160,.25)) contrast(1.05);
  -webkit-mask: linear-gradient(180deg, #000 80%, transparent); mask: linear-gradient(180deg, #000 80%, transparent); }

/* left flank */
.left { position: absolute; left: 80px; top: 230px; width: 560px; z-index: 3; }
.grade { display: inline-flex; align-items: center; gap: 12px; padding: 8px 18px 8px 14px; border: 1px solid rgba(255,210,122,.5); border-radius: 999px;
  font-family: var(--cond); font-weight: 600; font-size: 22px; letter-spacing: .2em; text-transform: uppercase; color: var(--warm); background: rgba(255,190,90,.08); }
.grade::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 12px var(--warm); }
.first { font-family: var(--cond); font-weight: 400; font-size: 46px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); margin-top: 26px; line-height: 1; }
.last { font-family: var(--disp); font-size: 170px; line-height: .86; letter-spacing: .01em; margin-top: 8px;
  background: linear-gradient(180deg, #fff 30%, #d8c9ad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.meta { display: grid; grid-template-columns: auto auto; gap: 18px 44px; margin-top: 30px; justify-content: start; }
.meta .v { font-family: var(--cond); font-size: 40px; font-weight: 600; line-height: 1; margin-top: 6px; text-transform: uppercase; }
.style { margin-top: 26px; font-size: 20px; color: rgba(246,241,231,.75); max-width: 520px; line-height: 1.35; }

/* right flank */
.right { position: absolute; right: 80px; top: 210px; width: 540px; z-index: 3; text-align: right; }
.team-top { display: flex; align-items: center; justify-content: flex-end; gap: 22px; }
.team-top img { width: 124px; height: 124px; filter: drop-shadow(0 0 24px rgba(255,210,140,.25)); }
.team-name { font-family: var(--disp); font-size: 72px; line-height: .9; margin-top: 6px; }
.maxbid { margin-top: 30px; padding: 20px 26px; border-radius: 18px; border: 1px solid var(--line);
  background: linear-gradient(270deg, rgba(255,200,110,.12), rgba(255,200,110,0)); }
.maxbid .v { font-family: var(--disp); font-size: 84px; line-height: 1; color: var(--warm); margin-top: 4px; text-shadow: 0 0 30px rgba(255,190,90,.35); }
.tmeta { display: flex; justify-content: flex-end; gap: 44px; margin-top: 22px; }
.tmeta .v { font-family: var(--cond); font-size: 36px; font-weight: 600; margin-top: 4px; }
.pool { margin-top: 30px; }
.pool-n { display: flex; justify-content: flex-end; gap: 36px; }
.pool-n .v { font-family: var(--disp); font-size: 52px; line-height: 1; margin-top: 2px; }
.pool-n .sold .v { color: #7ee2a8; }
.bar { margin-top: 14px; height: 6px; border-radius: 6px; background: rgba(255,255,255,.1); overflow: hidden; direction: rtl; }
.bar i { display: block; height: 100%; width: calc(var(--aa-sold-pct, 0) * 1%); background: linear-gradient(270deg, var(--warm), #7ee2a8); border-radius: 6px; }

/* scoreboard bid */
.board { position: absolute; left: 50%; top: 690px; transform: translateX(-50%); z-index: 4; width: 820px; height: 220px;
  border-radius: 26px; padding: 18px 40px 0;
  background:
    radial-gradient(circle at 50% 50%, rgba(255,176,46,.10) 0 1.2px, transparent 1.6px) 0 0 / 9px 9px,
    linear-gradient(180deg, rgba(22,16,8,.92), rgba(8,6,4,.95));
  border: 1px solid rgba(255,190,90,.35);
  box-shadow: 0 0 0 6px rgba(255,190,90,.05), 0 30px 80px rgba(0,0,0,.7), 0 0 120px rgba(255,170,60,.18), inset 0 1px 0 rgba(255,255,255,.08);
  display: grid; grid-template-rows: auto 1fr; justify-items: center; }
.board .head { display: flex; align-items: center; gap: 14px; }
.board .head .lbl { color: var(--warm); letter-spacing: .4em; }
.board .head i { width: 10px; height: 10px; border-radius: 50%; background: #ff4d3d; box-shadow: 0 0 12px #ff4d3d; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.fig { display: flex; align-items: baseline; gap: 20px; margin-top: -6px; }
.amt { font-family: var(--disp); font-size: 190px; line-height: 1; color: #ffe2a6; letter-spacing: .02em;
  text-shadow: 0 0 8px rgba(255,200,110,.9), 0 0 40px rgba(255,170,50,.7), 0 0 90px rgba(255,140,20,.45); }
.unit { font-family: var(--disp); font-size: 92px; color: var(--amber); text-shadow: 0 0 24px rgba(255,160,40,.6); }
.amt.aa-bump { animation: flare .8s cubic-bezier(.2,.9,.3,1.3); }
@keyframes flare {
  0% { transform: scale(1); filter: brightness(1); }
  25% { transform: scale(1.1); filter: brightness(1.8); }
  100% { transform: scale(1); filter: brightness(1); }
}

/* stat strip */
.stats { position: absolute; left: 60px; right: 60px; bottom: 36px; z-index: 3; display: grid; grid-template-columns: repeat(8, 1fr);
  border-top: 1px solid var(--line); padding-top: 18px; }
.st { text-align: center; position: relative; opacity: 0; animation: rise .7s ease-out forwards; animation-delay: calc(var(--i) * 90ms + 300ms); }
.st + .st::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
.st .v { display: block; font-family: var(--disp); font-size: 62px; line-height: 1; }
.st .l { display: block; font-family: var(--cond); font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: var(--mute); margin-top: 6px; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="aa-stage">
  <div class="rim"></div>
  <div class="floor"></div>
  <div class="cone"></div>
  <div class="cone inner"></div>
  <div class="lamp"></div>
  <div class="dust"></div><div class="dust b"></div>

  <header class="top">
    <div class="tour">
      <img data-src="tournament.logo" alt="">
      <div><div class="tour-n" data-bind="tournament.name"></div><div class="lbl tour-s" data-bind="tournament.season"></div></div>
    </div>
    <div class="brand"><img data-src="brand.logo" alt=""></div>
    <div class="spon">
      <div><div class="lbl" data-bind="sponsor.label"></div><div class="n" data-bind="sponsor.name"></div></div>
      <img data-src="sponsor.logo" alt="">
    </div>
  </header>

  <div class="player"><img data-src="player.photo" alt=""></div>

  <section class="left">
    <span class="grade" data-bind="player.grade"></span>
    <div class="first" data-bind="player.first"></div>
    <div class="last" data-bind="player.last"></div>
    <div class="meta">
      <div><div class="lbl">Role</div><div class="v" data-bind="player.role"></div></div>
      <div><div class="lbl">Age</div><div class="v" data-bind="player.age"></div></div>
    </div>
    <div class="style" data-bind="player.style"></div>
  </section>

  <section class="right">
    <div class="team-top">
      <div><div class="lbl">Bidding Team</div><div class="team-name" data-bind="team.name"></div></div>
      <img data-src="team.logo" alt="">
    </div>
    <div class="maxbid"><div class="lbl">Max Bid</div><div class="v" data-bind="team.maxBid"></div></div>
    <div class="tmeta">
      <div><div class="lbl">Purse</div><div class="v" data-bind="team.purse"></div></div>
      <div><div class="lbl">Slots</div><div class="v" data-bind="team.slots"></div></div>
    </div>
    <div class="pool">
      <div class="pool-n">
        <div><div class="lbl">Available</div><div class="v" data-bind="status.available"></div></div>
        <div class="sold"><div class="lbl">Sold</div><div class="v" data-bind="status.sold"></div></div>
        <div><div class="lbl">Unsold</div><div class="v" data-bind="status.unsold"></div></div>
      </div>
      <div class="bar"><i></i></div>
    </div>
  </section>

  <div class="board">
    <div class="head"><i></i><span class="lbl">Current Bid</span><i></i></div>
    <div class="fig"><span class="amt" data-bind="bid.amount"></span><span class="unit" data-bind="bid.unit"></span></div>
  </div>

  <div class="stats" data-stats="player.stats"><template><div class="st"><span class="v" data-stat="value"></span><span class="l" data-stat="label"></span></div></template></div>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
