<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 01 Bento Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Bento Noir: keynote-style tile grid, near-black, electric lime accent. */
:root {
  --bg: #050506;
  --tile: #111113;
  --tile-2: #16161a;
  --line: rgba(255,255,255,.07);
  --ink: #f5f5f7;
  --mute: #8a8a93;
  --lime: #c6ff3d;
  --lime-deep: #7bd000;
}
.aa-stage {
  background:
    radial-gradient(900px 600px at 78% -10%, rgba(198,255,61,.07), transparent 60%),
    radial-gradient(700px 500px at 10% 110%, rgba(120,120,255,.05), transparent 60%),
    var(--bg);
  color: var(--ink);
  font-family: Inter, system-ui, sans-serif;
  padding: 32px;
}
.grid {
  width: 100%; height: 100%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: 132px repeat(3, 1fr);
  gap: 20px;
}
.tile {
  position: relative;
  background: linear-gradient(180deg, var(--tile-2), var(--tile));
  border: 1px solid var(--line);
  border-radius: 32px;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
}
.eyebrow {
  display: block;
  font: 600 18px/1 "Space Grotesk", Inter, sans-serif;
  letter-spacing: .18em; text-transform: uppercase; color: var(--mute);
}

/* Header row */
.t-tourn { grid-column: 1 / 4; display: flex; align-items: center; gap: 26px; padding: 0 32px; }
.t-tourn img { width: 92px; height: 92px; object-fit: contain; }
.t-tourn .nm, .t-tourn .ss, .t-spons .nm { display: block; }
.t-tourn .nm { font: 800 40px/1.05 Inter, sans-serif; letter-spacing: -.02em; }
.t-tourn .ss { margin-top: 8px; font: 600 20px/1 "Space Grotesk", sans-serif; color: var(--lime); letter-spacing: .06em; }
.t-spons { grid-column: 4 / 6; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
.t-spons .nm { margin-top: 10px; font: 700 30px/1 Inter, sans-serif; letter-spacing: -.01em; }
.t-spons img { height: 86px; width: 220px; object-fit: contain; object-position: right center; }
.t-brand { grid-column: 6 / 7; display: grid; place-items: center; background: linear-gradient(145deg, #1b1d12, #0e0f0a); }
.t-brand img { height: 104px; width: 124px; object-fit: contain; }

/* Player */
.t-player {
  grid-column: 1 / 3; grid-row: 2 / 5;
  background:
    radial-gradient(420px 420px at 50% 36%, rgba(198,255,61,.16), transparent 70%),
    linear-gradient(180deg, #17181a, #0b0b0c);
}
.t-player::before {
  content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.07) 1.2px, transparent 1.2px);
  background-size: 22px 22px;
  mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
}
.t-player .photo {
  position: absolute; left: 0; right: 0; bottom: 150px; top: 60px;
  width: 100%; height: calc(100% - 210px); object-fit: contain; object-position: center bottom;
  filter: drop-shadow(0 30px 40px rgba(0,0,0,.6));
}
.t-player .shade { position: absolute; inset: auto 0 0 0; height: 330px; background: linear-gradient(180deg, transparent, #0b0b0c 58%); }
.t-player .chips { position: absolute; top: 28px; left: 28px; right: 28px; display: flex; justify-content: space-between; }
.chip {
  display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 999px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px);
  font: 700 22px/1 "Space Grotesk", sans-serif; letter-spacing: .08em; text-transform: uppercase;
}
.chip.lime { background: var(--lime); color: #0b0d05; border-color: transparent; }
.chip small { font-size: 16px; color: var(--mute); letter-spacing: .12em; }
.t-player .who { position: absolute; left: 36px; right: 36px; bottom: 34px; }
.t-player .first { font: 600 36px/1 Inter, sans-serif; color: #c9c9cf; letter-spacing: -.01em; }
.t-player .last { display: block; margin-top: 6px; font: 900 96px/.95 Inter, sans-serif; letter-spacing: -.045em; }
.t-player .role { margin-top: 14px; font: 500 22px/1.2 Inter, sans-serif; color: var(--mute); }
.t-player .role b { color: var(--lime); font-weight: 700; }

/* Bid hero */
.t-bid {
  grid-column: 3 / 6; grid-row: 2 / 4;
  padding: 40px 48px;
  display: flex; flex-direction: column; justify-content: space-between;
  background:
    radial-gradient(700px 360px at 30% 110%, rgba(198,255,61,.22), transparent 70%),
    linear-gradient(160deg, #1a1c14, #0d0e0a 70%);
  border-color: rgba(198,255,61,.22);
}
.t-bid::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%;
  background: linear-gradient(100deg, transparent, rgba(255,255,255,.06), transparent);
  animation: sheen 6s ease-in-out infinite;
}
@keyframes sheen { 0%, 55% { left: -60%; } 100% { left: 130%; } }
.t-bid .top { display: flex; justify-content: space-between; align-items: center; }
.live { display: inline-flex; align-items: center; gap: 12px; font: 700 22px/1 "Space Grotesk", sans-serif; letter-spacing: .2em; color: var(--lime); }
.live i { width: 14px; height: 14px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 0 rgba(198,255,61,.6); animation: ping 1.6s infinite; }
@keyframes ping { 70% { box-shadow: 0 0 0 16px rgba(198,255,61,0); } 100% { box-shadow: 0 0 0 0 rgba(198,255,61,0); } }
.base { font: 500 22px/1 Inter, sans-serif; color: var(--mute); }
.base span { color: var(--ink); font-weight: 700; }
.amount { display: flex; align-items: flex-end; gap: 20px; margin-bottom: -14px; }
.amount .rs { font: 800 100px/1 Inter, sans-serif; color: var(--lime); margin-bottom: 36px; opacity: .9; }
.amount .val {
  font: 900 290px/.82 Inter, sans-serif; letter-spacing: -.06em; font-variant-numeric: tabular-nums;
  background: linear-gradient(180deg, #f4ffd8 0%, var(--lime) 55%, var(--lime-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 40px rgba(198,255,61,.28));
  transform-origin: left bottom;
}
.amount .unit { font: 800 100px/1 Inter, sans-serif; letter-spacing: -.03em; color: var(--ink); margin-bottom: 36px; }
.amount .val.aa-bump { animation: bid-bump .7s cubic-bezier(.2,.9,.3,1.3); }
@keyframes bid-bump {
  0% { transform: scale(1); filter: drop-shadow(0 0 40px rgba(198,255,61,.28)); }
  30% { transform: scale(1.07); filter: drop-shadow(0 0 90px rgba(198,255,61,.9)) brightness(1.3); }
  100% { transform: scale(1); filter: drop-shadow(0 0 40px rgba(198,255,61,.28)); }
}

/* Team */
.t-team {
  grid-column: 6 / 7; grid-row: 2 / 4;
  padding: 32px 28px; display: flex; flex-direction: column; align-items: center; text-align: center;
}
.t-team .ring {
  margin-top: 26px; width: 188px; height: 188px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(from 0deg, var(--lime), transparent 40%, var(--lime) 80%, transparent);
  animation: spin 12s linear infinite; padding: 3px;
}
.t-team .ring > div { width: 100%; height: 100%; border-radius: 50%; background: #0d0d0f; display: grid; place-items: center; animation: spin 12s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.t-team img { width: 150px; height: 150px; object-fit: contain; }
.t-team .nm { margin-top: 26px; font: 800 34px/1.1 Inter, sans-serif; letter-spacing: -.02em; }
.t-team .max { margin-top: auto; width: 100%; padding: 20px 0 4px; border-top: 1px solid var(--line); }
.t-team .max .v { display: block; margin-top: 10px; font: 800 60px/1 Inter, sans-serif; letter-spacing: -.03em; color: var(--lime); }
.t-team .sub { margin-top: 14px; display: flex; justify-content: space-between; font: 500 18px/1 Inter, sans-serif; color: var(--mute); width: 100%; }
.t-team .sub b { color: var(--ink); font-weight: 700; }

/* Stats */
.t-stats { grid-column: 3 / 6; grid-row: 4 / 5; padding: 26px 32px; display: flex; flex-direction: column; }
.stats { flex: 1; margin-top: 14px; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px 14px; }
.stat { display: flex; flex-direction: column; justify-content: center; padding-left: 16px; border-left: 2px solid rgba(198,255,61,.35); }
.stat .v { font: 800 44px/1 Inter, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .l { margin-top: 6px; font: 600 16px/1 "Space Grotesk", sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }

/* Status */
.t-status { grid-column: 6 / 7; grid-row: 4 / 5; padding: 26px 28px; display: flex; flex-direction: column; }
.t-status .rows { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
.t-status .row { display: flex; justify-content: space-between; align-items: baseline; font: 600 20px/1 Inter, sans-serif; color: var(--mute); }
.t-status .row span[data-bind] { font: 800 34px/1 Inter, sans-serif; color: var(--ink); }
.t-status .row.sold span[data-bind] { color: var(--lime); }
.bar { margin-top: auto; height: 10px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: calc(var(--aa-sold-pct, 0) * 1%); background: linear-gradient(90deg, var(--lime-deep), var(--lime)); border-radius: inherit; transition: width .8s ease; }
</style>
</head>
<body>
<div class="aa-stage">
  <div class="grid">
    <div class="tile t-tourn">
      <img data-src="tournament.logo" alt="">
      <div>
        <div class="nm" data-bind="tournament.name"></div>
        <div class="ss" data-bind="tournament.season"></div>
      </div>
    </div>
    <div class="tile t-spons">
      <div>
        <div class="eyebrow" data-bind="sponsor.label"></div>
        <div class="nm" data-bind="sponsor.name"></div>
      </div>
      <img data-src="sponsor.logo" alt="">
    </div>
    <div class="tile t-brand"><img data-src="brand.logo" alt=""></div>

    <div class="tile t-player">
      <img class="photo" data-src="player.photo" alt="">
      <div class="shade"></div>
      <div class="chips">
        <span class="chip lime" data-bind="player.grade"></span>
        <span class="chip"><small>Age</small><span data-bind="player.age"></span></span>
      </div>
      <div class="who">
        <span class="first" data-bind="player.first"></span>
        <span class="last" data-bind="player.last"></span>
        <div class="role"><b data-bind="player.role"></b> · <span data-bind="player.style"></span></div>
      </div>
    </div>

    <div class="tile t-bid">
      <div class="top">
        <span class="live"><i></i>Current Bid</span>
        <span class="base">Base <span data-bind="player.basePrice"></span></span>
      </div>
      <div class="amount">
        <span class="rs">₹</span>
        <span class="val" data-bind="bid.amount"></span>
        <span class="unit" data-bind="bid.unit"></span>
      </div>
    </div>

    <div class="tile t-team">
      <div class="eyebrow">Bidding Team</div>
      <div class="ring"><div><img data-src="team.logo" alt=""></div></div>
      <div class="nm" data-bind="team.name"></div>
      <div class="max">
        <div class="eyebrow">Max Bid</div>
        <span class="v" data-bind="team.maxBid"></span>
        <div class="sub"><span>Purse <b data-bind="team.purse"></b></span><span>Slots <b data-bind="team.slots"></b></span></div>
      </div>
    </div>

    <div class="tile t-stats">
      <div class="eyebrow">Career Stats</div>
      <div class="stats" data-stats="player.stats">
        <template><div class="stat"><span class="v" data-stat="value"></span><span class="l" data-stat="label"></span></div></template>
      </div>
    </div>

    <div class="tile t-status">
      <div class="eyebrow">Auction Pool</div>
      <div class="rows">
        <div class="row">Available <span data-bind="status.available"></span></div>
        <div class="row sold">Sold <span data-bind="status.sold"></span></div>
        <div class="row">Unsold <span data-bind="status.unsold"></span></div>
      </div>
      <div class="bar"><i></i></div>
    </div>
  </div>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
