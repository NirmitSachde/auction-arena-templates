<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Arena · 04 Carbon Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* 04 Carbon Pro: F1 pit-wall. Carbon weave, racing red, telemetry rails, rev-gauge bid. */
:root {
  --red: #ff1e2d;
  --red-d: #b3000f;
  --ink: #f4f4f5;
  --mute: #9a9aa3;
  --line: rgba(255,255,255,.09);
  --panel: rgba(12,12,14,.78);
}
.aa-stage {
  font-family: "Titillium Web", "Segoe UI", sans-serif;
  color: var(--ink);
  background-color: #111113;
  background-image:
    radial-gradient(ellipse 60% 55% at 50% 48%, rgba(255,30,45,.16), transparent 70%),
    radial-gradient(ellipse 120% 80% at 50% 120%, rgba(0,0,0,.9), transparent 60%),
    linear-gradient(27deg, #0c0c0d 5px, transparent 5px),
    linear-gradient(207deg, #0c0c0d 5px, transparent 5px),
    linear-gradient(27deg, #1c1c1f 5px, transparent 5px),
    linear-gradient(207deg, #1c1c1f 5px, transparent 5px),
    linear-gradient(90deg, #151517 10px, transparent 10px),
    linear-gradient(#18181a 25%, #141416 25%, #141416 50%, transparent 50%, transparent 75%, #1f1f22 75%, #1f1f22);
  background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
  background-position: 0 0, 0 0, 0 5px, 10px 0, 0 10px, 10px 5px, 0 0, 0 0;
}
/* Racing stripe accents */
.aa-stage::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(90deg, transparent 0 40px, var(--red) 40px 46px, transparent 46px) 0 0 / 100% 100% no-repeat,
    linear-gradient(90deg, transparent, rgba(255,255,255,.05) 50%, transparent) 0 0 / 100% 1px no-repeat;
  opacity: .9;
}

.tour .nm, .tour .ss, .spon .lb, .spon .nm, .plate .first, .plate .last, .team .nm, .team .max .v { display: block; }

/* Header */
.hdr {
  position: absolute; left: 72px; right: 48px; top: 36px; height: 96px;
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
}
.tour { display: flex; align-items: center; gap: 20px; }
.tour img { width: 84px; height: 84px; object-fit: contain; }
.tour .nm { font-family: Oswald, sans-serif; font-weight: 600; font-size: 34px; letter-spacing: 1px; text-transform: uppercase; line-height: 1; }
.tour .ss { font-size: 20px; color: var(--mute); letter-spacing: 3px; text-transform: uppercase; margin-top: 8px; font-weight: 600; }
.brand img { height: 92px; width: auto; }
.spon { justify-self: end; display: flex; align-items: center; gap: 20px;
  padding: 10px 14px 10px 26px; background: var(--panel); border: 1px solid var(--line);
  clip-path: polygon(18px 0, 100% 0, 100% 100%, 0 100%); }
.spon .lb { font-size: 16px; letter-spacing: 4px; text-transform: uppercase; color: var(--red); font-weight: 700; text-align: right; }
.spon .nm { font-family: Oswald, sans-serif; font-size: 28px; font-weight: 500; text-align: right; line-height: 1.1; }
.spon img { height: 70px; width: auto; background: rgba(255,255,255,.04); border-radius: 6px; padding: 4px 8px; }

/* Driver card (player) */
.driver {
  position: absolute; left: 72px; top: 164px; width: 560px; height: 760px;
  background: linear-gradient(180deg, rgba(255,30,45,.2), rgba(10,10,12,.9) 75%);
  border: 1px solid var(--line);
  clip-path: polygon(0 0, calc(100% - 48px) 0, 100% 48px, 100% 100%, 0 100%);
  overflow: hidden;
}
.driver::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(115deg, transparent 0 22px, rgba(255,255,255,.035) 22px 24px);
}
.driver .num {
  position: absolute; right: 26px; top: 8px; font-family: Oswald, sans-serif; font-weight: 700;
  font-size: 220px; line-height: 1; color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.14);
}
.driver .photo { position: absolute; left: 0; right: 0; top: 40px; bottom: 210px; }
.driver .photo img { width: 100%; height: 100%; object-fit: contain; object-position: center bottom; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
.driver .plate {
  position: absolute; left: 0; right: 0; bottom: 0; height: 210px; padding: 22px 32px;
  background: linear-gradient(180deg, rgba(8,8,9,.6), #0a0a0b 40%);
  border-top: 4px solid var(--red);
}
.plate .first { font-size: 30px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); line-height: 1; }
.plate .last { font-family: Oswald, sans-serif; font-weight: 700; font-size: 84px; line-height: 1; text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; white-space: nowrap; }
.plate .chips { display: flex; gap: 10px; margin-top: 14px; }
.chip { font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 6px 14px; background: rgba(255,255,255,.07); border-left: 3px solid var(--red); white-space: nowrap; }
.chip.hot { background: var(--red); border-left-color: #fff; }

/* Rev gauge bid */
.gauge-wrap { position: absolute; left: 672px; top: 150px; width: 640px; height: 620px; }
.gauge {
  position: absolute; left: 20px; top: 0; width: 600px; height: 600px; border-radius: 50%;
  background:
    radial-gradient(circle, #0b0b0c 0 57%, transparent 57.3%),
    conic-gradient(from 225deg, var(--red-d), var(--red) 55%, #ff8a8f 72%, rgba(255,255,255,.07) 72.2% 75%, transparent 75%);
  box-shadow: 0 0 120px rgba(255,30,45,.25);
}
.gauge::before { /* tick marks */
  content: ""; position: absolute; inset: -22px; border-radius: 50%;
  background: repeating-conic-gradient(from 225deg, rgba(255,255,255,.55) 0 .6deg, transparent .6deg 6.75deg);
  -webkit-mask: radial-gradient(circle, transparent 0 63%, #000 63.3% 67%, transparent 67.3%), conic-gradient(from 225deg, #000 0 75%, transparent 75%);
  -webkit-mask-composite: source-in; mask-composite: intersect;
}
.gauge::after { /* ambient sweep */
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(from 0deg, transparent 0 80%, rgba(255,255,255,.35) 88%, transparent 90%);
  -webkit-mask: radial-gradient(circle, transparent 0 57%, #000 57.3%);
  mask: radial-gradient(circle, transparent 0 57%, #000 57.3%);
  animation: sweep 4.5s linear infinite;
}
@keyframes sweep { to { transform: rotate(360deg); } }
.readout { position: absolute; left: 20px; top: 0; width: 600px; height: 600px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.readout .k { font-size: 22px; letter-spacing: 8px; font-weight: 700; color: var(--red); text-transform: uppercase; }
.readout .amt { display: flex; align-items: baseline; gap: 10px; margin-top: 4px; }
.bid-amt { font-family: Oswald, sans-serif; font-weight: 700; font-size: 196px; line-height: .95; letter-spacing: -2px; text-shadow: 0 0 40px rgba(255,30,45,.45); font-variant-numeric: tabular-nums; }
.bid-unit { font-family: Oswald, sans-serif; font-weight: 600; font-size: 60px; color: var(--red); }
.readout .base { font-size: 20px; color: var(--mute); letter-spacing: 3px; text-transform: uppercase; margin-top: 10px; font-weight: 600; }
.readout .base b { color: var(--ink); }
.bid-amt.aa-bump { animation: rev .7s cubic-bezier(.2,.9,.3,1.3); }
@keyframes rev {
  0% { transform: scale(1); color: var(--ink); }
  25% { transform: scale(1.14) skewX(-6deg); color: #fff; text-shadow: 0 0 60px var(--red), 0 0 120px var(--red); }
  100% { transform: scale(1); }
}
.lap { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-family: Oswald, sans-serif; font-size: 18px; letter-spacing: 6px; color: var(--mute); }
.lap span { color: var(--red); }

/* Team box, pit-board style */
.team {
  position: absolute; left: 672px; top: 794px; width: 640px; height: 130px;
  display: grid; grid-template-columns: 130px 1fr auto; align-items: center; gap: 22px;
  padding: 0 28px 0 0; background: var(--panel); border: 1px solid var(--line); border-left: 6px solid var(--red);
}
.team img { width: 130px; height: 128px; object-fit: contain; padding: 14px; background: rgba(255,30,45,.1); }
.team .k { font-size: 16px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; font-weight: 700; }
.team .nm { font-family: Oswald, sans-serif; font-size: 40px; font-weight: 600; text-transform: uppercase; line-height: 1.1; white-space: nowrap; }
.team .max { text-align: right; }
.team .max .v { font-family: Oswald, sans-serif; font-size: 46px; font-weight: 700; line-height: 1; }

/* Telemetry */
.tele {
  position: absolute; left: 1352px; top: 164px; width: 496px; height: 760px;
  background: var(--panel); border: 1px solid var(--line); padding: 26px 30px;
  display: flex; flex-direction: column;
}
.tele h3 { display: flex; justify-content: space-between; align-items: center; font-size: 20px; letter-spacing: 6px; text-transform: uppercase; font-weight: 700; color: var(--mute); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.tele h3 i { font-style: normal; color: var(--red); display: inline-flex; align-items: center; gap: 8px; }
.tele h3 i::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--red); box-shadow: 0 0 12px var(--red); animation: blink 1.4s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
.stats { flex: 1; display: grid; grid-template-rows: repeat(8, 1fr); }
.st { display: grid; grid-template-columns: 44px 1fr auto; grid-template-rows: auto 6px; column-gap: 12px; align-content: center; border-bottom: 1px solid rgba(255,255,255,.05); }
.st::before { content: "S" counter(s); counter-increment: s; grid-row: 1 / 3; align-self: center; font-family: Oswald, sans-serif; font-size: 18px; color: var(--red); font-weight: 600; }
.stats { counter-reset: s; }
.st [data-stat="label"] { font-size: 22px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #c9c9cf; align-self: end; }
.st [data-stat="value"] { order: 2; grid-row: 1 / 3; align-self: center; font-family: Oswald, sans-serif; font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }
.st::after {
  content: ""; grid-column: 2; grid-row: 2; height: 4px; margin-top: 2px; align-self: start;
  background: linear-gradient(90deg, var(--red), rgba(255,30,45,.1)); transform-origin: left;
  width: calc(100% - var(--i) * 6%); animation: rail 1.2s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i) * 80ms);
}
@keyframes rail { from { transform: scaleX(0); } }

/* Status strip */
.status {
  position: absolute; left: 72px; right: 72px; bottom: 44px; height: 92px;
  display: grid; grid-template-columns: repeat(3, 250px) 1fr; align-items: stretch;
  background: var(--panel); border: 1px solid var(--line);
}
.status .c { display: flex; align-items: center; gap: 16px; padding: 0 28px; border-right: 1px solid var(--line); }
.status .c .v { font-family: Oswald, sans-serif; font-size: 50px; font-weight: 700; line-height: 1; }
.status .c .l { font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--mute); font-weight: 700; line-height: 1.1; }
.status .c.sold .v { color: #34e07a; }
.status .c.uns .v { color: var(--red); }
.prog { display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 0 32px; }
.prog .t { display: flex; justify-content: space-between; font-size: 18px; letter-spacing: 3px; text-transform: uppercase; color: var(--mute); font-weight: 700; }
.bar { height: 14px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.08) 0 14px, transparent 14px 18px); position: relative; }
.bar b { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--aa-sold-pct, 0) * 1%);
  background: repeating-linear-gradient(90deg, var(--red) 0 14px, transparent 14px 18px); box-shadow: 0 0 18px rgba(255,30,45,.5); transition: width .6s; }
</style>
</head>
<body>
<div class="aa-stage">
  <header class="hdr">
    <div class="tour">
      <img data-src="tournament.logo" alt="">
      <div><div class="nm" data-bind="tournament.name"></div><div class="ss" data-bind="tournament.season"></div></div>
    </div>
    <div class="brand"><img data-src="brand.logo" alt=""></div>
    <div class="spon">
      <div><div class="lb" data-bind="sponsor.label"></div><div class="nm" data-bind="sponsor.name"></div></div>
      <img data-src="sponsor.logo" alt="">
    </div>
  </header>

  <section class="driver">
    <div class="num" data-bind="player.number"></div>
    <div class="photo"><img data-src="player.photo" alt=""></div>
    <div class="plate">
      <div class="first" data-bind="player.first"></div>
      <div class="last" data-bind="player.last"></div>
      <div class="chips">
        <span class="chip hot" data-bind="player.grade"></span>
        <span class="chip" data-bind="player.role"></span>
        <span class="chip">Age <span data-bind="player.age"></span></span>
      </div>
    </div>
  </section>

  <section class="gauge-wrap">
    <div class="gauge"></div>
    <div class="readout">
      <div class="k">Current Bid</div>
      <div class="amt"><span class="bid-amt" data-bind="bid.amount"></span><span class="bid-unit" data-bind="bid.unit"></span></div>
      <div class="base">Base <b data-bind="player.basePrice"></b></div>
    </div>
  </section>

  <section class="team">
    <img data-src="team.logo" alt="">
    <div><div class="k">Leading Bid</div><div class="nm" data-bind="team.name"></div></div>
    <div class="max"><div class="k">Max Bid</div><div class="v" data-bind="team.maxBid"></div></div>
  </section>

  <section class="tele">
    <h3>Telemetry <i>Live</i></h3>
    <div class="stats" data-stats="player.stats">
      <template><div class="st"><span data-stat="label"></span><span data-stat="value"></span></div></template>
    </div>
  </section>

  <section class="status">
    <div class="c"><span class="v" data-bind="status.available"></span><span class="l">Players<br>Available</span></div>
    <div class="c sold"><span class="v" data-bind="status.sold"></span><span class="l">Players<br>Sold</span></div>
    <div class="c uns"><span class="v" data-bind="status.unsold"></span><span class="l">Players<br>Unsold</span></div>
    <div class="prog">
      <div class="t"><span>Auction Progress</span><span>Purse <span data-bind="team.purse"></span> · Slots <span data-bind="team.slots"></span></span></div>
      <div class="bar"><b></b></div>
    </div>
  </section>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
