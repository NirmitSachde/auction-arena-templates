<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 14 Velocity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Velocity: everything rides a 12deg diagonal, speed streaks, chevrons aim at the bid. */
:root {
  --skew: -12deg;
  --volt: #d7ff1f;
  --hot: #ff3d2e;
  --ink: #07080c;
  --steel: #151821;
  --txt: #f5f7fb;
  --dim: rgba(235, 240, 250, .6);
}
.aa-stage {
  font-family: "Oswald", sans-serif;
  color: var(--txt);
  background:
    radial-gradient(900px 600px at 30% 60%, rgba(255, 61, 46, .20), transparent 70%),
    radial-gradient(800px 500px at 85% 70%, rgba(215, 255, 31, .10), transparent 70%),
    linear-gradient(110deg, #0b0d14 0%, #07080c 60%, #0d0f16 100%);
}
/* Speed streaks, skewed and sliding */
.streaks {
  position: absolute; inset: -100px -400px; pointer-events: none; transform: skewY(-12deg);
  background:
    repeating-linear-gradient(90deg, transparent 0 180px, rgba(255, 255, 255, .05) 180px 182px, transparent 182px 460px),
    repeating-linear-gradient(90deg, transparent 0 90px, rgba(255, 61, 46, .10) 90px 92px, transparent 92px 700px);
  -webkit-mask-image: repeating-linear-gradient(0deg, #000 0 3px, transparent 3px 14px);
          mask-image: repeating-linear-gradient(0deg, #000 0 3px, transparent 3px 14px);
  animation: streak 3.2s linear infinite;
}
@keyframes streak { to { transform: skewY(-12deg) translateX(-460px); } }

div[data-bind] { display: block; }
.sk { transform: skewX(var(--skew)); }
.unsk { transform: skewX(12deg); }

/* Top bar: skewed plates */
.top { position: absolute; left: 0; right: 0; top: 34px; height: 104px; display: flex; align-items: stretch; gap: 18px; padding: 0 70px 0 0; }
.plate { display: flex; align-items: center; gap: 20px; padding: 0 40px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .10); }
.plate.tour { padding-left: 110px; margin-left: -40px; background: linear-gradient(90deg, var(--hot), #c21c10); border: 0; }
.plate img { height: 78px; width: auto; }
.tour .n { font: 700 34px/1 "Oswald"; text-transform: uppercase; letter-spacing: .02em; }
.tour .s { font: 500 18px/1.4 "Oswald"; letter-spacing: .16em; text-transform: uppercase; opacity: .85; margin-top: 4px; }
.plate.brand { margin-left: auto; }
.plate.brand img { height: 88px; }
.spons .l { font: 500 15px/1 "Oswald"; letter-spacing: .3em; text-transform: uppercase; color: var(--volt); }
.spons .n { font: 600 28px/1.3 "Oswald"; text-transform: uppercase; }

/* Player hero on a skewed slab */
.slab { position: absolute; left: 60px; top: 172px; width: 640px; height: 860px; overflow: hidden;
  background: linear-gradient(160deg, #1d212d, #0d0f16 70%); border-right: 10px solid var(--hot); }
.slab::before { content: ""; position: absolute; inset: 0;
  background: repeating-linear-gradient(90deg, rgba(255, 255, 255, .04) 0 2px, transparent 2px 26px); }
.slab::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(0deg, rgba(7, 8, 12, .95), transparent); }
.slab .inner { position: absolute; inset: 0 -120px; }
.slab img { position: absolute; left: 50%; bottom: 0; width: 640px; height: 853px; transform: translateX(-50%) skewX(12deg); object-fit: cover; object-position: 50% 100%; }
.num { position: absolute; right: 30px; top: 10px; font: 400 260px/1 "Bebas Neue"; color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .15); z-index: 0; }

/* Identity band over the slab bottom */
.idband { position: absolute; left: 30px; top: 880px; width: 640px; height: 120px; z-index: 3; display: flex; align-items: stretch; }
.idband > div { display: flex; flex-direction: column; justify-content: center; padding: 0 26px; }
.idband .g { background: var(--volt); color: var(--ink); }
.idband .a, .idband .r { background: #fff; color: var(--ink); border-left: 2px solid rgba(0, 0, 0, .15); }
.idband .k { font: 600 14px/1 "Oswald"; letter-spacing: .26em; text-transform: uppercase; opacity: .7; }
.idband .v { font: 700 38px/1.1 "Oswald"; text-transform: uppercase; margin-top: 6px; }
.idband .r { flex: 1; }

/* Name */
.name { position: absolute; left: 760px; top: 170px; width: 1100px; }
.name .kick { display: inline-flex; align-items: center; gap: 14px; font: 600 20px/1 "Oswald"; letter-spacing: .34em; text-transform: uppercase; color: var(--volt); }
.name .kick::before { content: ""; width: 60px; height: 6px; background: var(--volt); transform: skewX(var(--skew)); }
.name .first { font: 400 70px/.95 "Bebas Neue"; color: var(--dim); letter-spacing: .02em; margin-top: 14px; padding-left: 24px; }
.name .last { font: 400 190px/.82 "Bebas Neue"; letter-spacing: .01em; display: block; transform: skewX(var(--skew)); transform-origin: left bottom;
  text-shadow: -14px 0 0 rgba(255, 61, 46, .45), -28px 0 0 rgba(255, 61, 46, .18); }
.name .style { font: 500 22px/1 "Oswald"; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); margin-top: 16px; }

/* Stats: a skewed strip of 8 blades */
.stats { position: absolute; left: 740px; top: 540px; width: 1120px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.stat { height: 118px; background: linear-gradient(180deg, rgba(255, 255, 255, .09), rgba(255, 255, 255, .03)); border-top: 4px solid var(--hot);
  transform: skewX(var(--skew)); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  animation: blade .6s cubic-bezier(.2, .9, .2, 1) both; animation-delay: calc(var(--i) * 60ms + 150ms); }
.stat:nth-child(odd) { border-top-color: var(--volt); }
.stat span { transform: skewX(12deg); }
.stat [data-stat="value"] { font: 700 40px/1 "Oswald"; }
.stat [data-stat="label"] { font: 500 13px/1.1 "Oswald"; letter-spacing: .16em; text-transform: uppercase; color: var(--dim); text-align: center; padding: 0 6px; }
@keyframes blade { from { opacity: 0; transform: skewX(var(--skew)) translateX(80px); } }

/* Bid band with chevrons */
.bidband { position: absolute; left: 780px; top: 700px; width: 1240px; height: 240px; background: linear-gradient(90deg, var(--volt), #b6e600); color: var(--ink);
  transform: skewX(var(--skew)); box-shadow: 0 30px 80px rgba(215, 255, 31, .25); }
.chevs { position: absolute; left: 36px; top: 50%; display: flex; transform: translateY(-50%) skewX(12deg); }
.chevs i { width: 44px; height: 100px; background: var(--ink); clip-path: polygon(0 0, 45% 0, 100% 50%, 45% 100%, 0 100%, 55% 50%); margin-right: -10px;
  animation: chev 1.2s ease-in-out infinite; animation-delay: calc(var(--c) * 150ms); opacity: .2; }
@keyframes chev { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
.bidcore { position: absolute; left: 200px; top: 0; bottom: 0; display: flex; align-items: center; gap: 30px; transform: skewX(12deg); }
.bidcore .k { font: 700 26px/1.05 "Oswald"; letter-spacing: .22em; text-transform: uppercase; }
.bidcore .amt { font: 400 250px/.8 "Bebas Neue"; letter-spacing: -.01em; padding-top: 24px; }
.bidcore .unit { font: 400 110px/1 "Bebas Neue"; align-self: flex-end; padding-bottom: 36px; }
.bidcore .amt.aa-bump { animation: vbump .55s cubic-bezier(.2, .9, .3, 1.4); }
@keyframes vbump { 0% { transform: translateX(0); } 30% { transform: translateX(26px) scale(1.08); text-shadow: -18px 0 0 rgba(7, 8, 12, .3), -36px 0 0 rgba(7, 8, 12, .12); } 100% { transform: none; } }

/* Team strip under bid */
.teamrow { position: absolute; left: 740px; top: 960px; right: 60px; height: 88px; display: flex; gap: 10px; }
.tcell { transform: skewX(var(--skew)); background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .10); display: flex; align-items: center; padding: 0 26px; }
.tcell > * { transform: skewX(12deg); }
.tcell.team { flex: 1.5; gap: 18px; }
.tcell.team img { width: 64px; height: 64px; object-fit: contain; }
.tcell .k { font: 600 13px/1 "Oswald"; letter-spacing: .26em; text-transform: uppercase; color: var(--dim); }
.tcell .v { font: 700 34px/1.1 "Oswald"; text-transform: uppercase; display: block; }
.tcell.team .v { font-size: 30px; white-space: nowrap; }
.tcell.max { background: var(--hot); border-color: var(--hot); flex: 1; }
.tcell.max .k { color: rgba(255, 255, 255, .85); }
.tcell.st { flex: .72; }
.tcell.st .v { font-size: 30px; }
.tcell.st.sold .v { color: var(--volt); }
</style>
</head>
<body>
<div class="aa-stage">
  <div class="streaks"></div>

  <header class="top">
    <div class="plate tour sk"><div class="unsk" style="display:flex;align-items:center;gap:20px">
      <img data-src="tournament.logo" alt="">
      <div><div class="n" data-bind="tournament.name"></div><div class="s" data-bind="tournament.season"></div></div>
    </div></div>
    <div class="plate spons sk"><div class="unsk" style="display:flex;align-items:center;gap:20px">
      <img data-src="sponsor.logo" alt="" style="height:70px">
      <div><div class="l" data-bind="sponsor.label"></div><div class="n" data-bind="sponsor.name"></div></div>
    </div></div>
    <div class="plate brand sk"><div class="unsk"><img data-src="brand.logo" alt=""></div></div>
  </header>

  <div class="slab sk">
    <div class="num unsk" data-bind="player.number"></div>
    <div class="inner"><img data-src="player.photo" alt=""></div>
  </div>
  <div class="idband sk">
    <div class="g"><div class="unsk"><div class="k">Grade</div><div class="v" data-bind="player.grade"></div></div></div>
    <div class="a"><div class="unsk"><div class="k">Age</div><div class="v" data-bind="player.age"></div></div></div>
    <div class="r"><div class="unsk"><div class="k">Role</div><div class="v" data-bind="player.role"></div></div></div>
  </div>

  <div class="name">
    <div class="kick">Now Bidding</div>
    <div class="first" data-bind="player.first"></div>
    <span class="last" data-bind="player.last"></span>
    <div class="style" data-bind="player.style"></div>
  </div>

  <div class="stats" data-stats="player.stats">
    <template><div class="stat"><span data-stat="value"></span><span data-stat="label"></span></div></template>
  </div>

  <div class="bidband">
    <div class="chevs"><i style="--c:0"></i><i style="--c:1"></i><i style="--c:2"></i></div>
    <div class="bidcore">
      <div class="k">Current<br>Bid</div>
      <span class="amt" data-bind="bid.amount"></span>
      <span class="unit" data-bind="bid.unit"></span>
    </div>
  </div>

  <div class="teamrow">
    <div class="tcell team"><img data-src="team.logo" alt=""><div><div class="k">Bidding Team</div><span class="v" data-bind="team.name"></span></div></div>
    <div class="tcell max"><div><div class="k">Max Bid</div><span class="v" data-bind="team.maxBid"></span></div></div>
    <div class="tcell st"><div><div class="k">Available</div><span class="v" data-bind="status.available"></span></div></div>
    <div class="tcell st sold"><div><div class="k">Sold</div><span class="v" data-bind="status.sold"></span></div></div>
    <div class="tcell st"><div><div class="k">Unsold</div><span class="v" data-bind="status.unsold"></span></div></div>
  </div>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
