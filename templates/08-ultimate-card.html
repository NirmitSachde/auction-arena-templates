<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 08 Ultimate Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* 08 Ultimate Card: holographic collectible card centre stage. */
div[data-bind] { display: block; }
:root {
  --holo: linear-gradient(115deg, #7cf7ff 0%, #a78bfa 22%, #ff7ad9 42%, #ffd36e 62%, #6effc1 82%, #7cf7ff 100%);
  --ink: #f4f2ff; --dim: #a9a6c9;
}
.aa-stage {
  background:
    radial-gradient(700px 520px at 50% 52%, rgba(167,139,250,.35), transparent 70%),
    radial-gradient(900px 600px at 12% 110%, rgba(34,211,238,.18), transparent 70%),
    radial-gradient(900px 600px at 90% -10%, rgba(255,122,217,.16), transparent 70%),
    #07061a;
  color: var(--ink); font-family: Poppins, system-ui, sans-serif;
}
/* Slow light rays behind the card */
.rays {
  position: absolute; left: 50%; top: 52%; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
  background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.055) 0 4deg, transparent 4deg 12deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 45%);
          mask-image: radial-gradient(circle, #000 0, transparent 45%);
  animation: uc-spin 90s linear infinite;
}
.floor {
  position: absolute; left: 0; right: 0; bottom: 0; height: 300px;
  background: repeating-linear-gradient(90deg, rgba(167,139,250,.12) 0 1px, transparent 1px 80px);
  transform: perspective(500px) rotateX(62deg); transform-origin: bottom;
  -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000);
}

/* Card */
.card-wrap { position: absolute; left: 650px; top: 78px; width: 620px; height: 924px; filter: drop-shadow(0 40px 60px rgba(0,0,0,.6)) drop-shadow(0 0 50px rgba(167,139,250,.35)); }
.card {
  position: absolute; inset: 0; padding: 4px; background: var(--holo); background-size: 200% 200%;
  clip-path: polygon(14% 0, 86% 0, 100% 7%, 100% 90%, 50% 100%, 0 90%, 0 7%);
  animation: uc-foil 8s ease-in-out infinite alternate;
}
.face {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  clip-path: polygon(14% 0, 86% 0, 100% 7%, 100% 90%, 50% 100%, 0 90%, 0 7%);
  background:
    radial-gradient(420px 360px at 60% 30%, rgba(167,139,250,.45), transparent 70%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 10px),
    linear-gradient(170deg, #1c1846, #0d0b26 60%, #07061a);
}
/* Foil sheen that sweeps across the card */
.face::after {
  content: ""; position: absolute; inset: -20%;
  background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,.28) 48%, rgba(124,247,255,.18) 52%, transparent 60%);
  mix-blend-mode: screen; animation: uc-sheen 5.5s ease-in-out infinite; pointer-events: none;
}
.face::before {
  content: ""; position: absolute; inset: 0; background: var(--holo); opacity: .09; mix-blend-mode: color-dodge; pointer-events: none;
}
.c-photo {
  position: absolute; right: 24px; top: 40px; width: 420px; height: 480px;
  object-fit: contain; object-position: center bottom;
  -webkit-mask-image: linear-gradient(#000 70%, transparent), linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
  -webkit-mask-composite: source-in;
          mask-image: linear-gradient(#000 70%, transparent), linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent);
          mask-composite: intersect;
}
.c-side { position: absolute; left: 44px; top: 70px; width: 130px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.c-num { font-family: Oswald; font-weight: 700; font-size: 104px; line-height: .9; }
.c-grade { font-family: Oswald; font-weight: 600; font-size: 30px; letter-spacing: .08em; text-transform: uppercase;
  background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }
.c-role { font: 600 17px Poppins; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.c-rule { width: 60px; height: 2px; background: rgba(255,255,255,.3); margin: 6px 0; }
.c-side img { width: 70px; height: 70px; object-fit: contain; }
.c-age { font-family: Oswald; font-size: 20px; letter-spacing: .1em; color: var(--dim); }
.c-age b { color: var(--ink); font-size: 30px; font-weight: 600; }

.c-name { position: absolute; left: 30px; right: 30px; top: 522px; text-align: center;
  font-family: Oswald; font-weight: 700; font-size: 46px; line-height: 1; text-transform: uppercase; letter-spacing: .03em; }
.c-style { position: absolute; left: 30px; right: 30px; top: 578px; text-align: center; font: 500 16px Poppins; color: var(--dim); }
.c-line { position: absolute; left: 60px; right: 60px; top: 614px; height: 2px; background: var(--holo); opacity: .7; }
.c-stats { position: absolute; left: 60px; right: 60px; top: 622px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 40px; }
.c-stat { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
.c-stat .l { font: 600 14px Poppins; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); white-space: nowrap; }
.c-stat .v { font-family: Oswald; font-weight: 600; font-size: 30px; line-height: 1.05; }
.c-stat:nth-child(n+8) { border-bottom: 0; }
.base { padding: 26px 28px; display: flex; align-items: center; justify-content: space-between; }
.base .v { font-family: Oswald; font-weight: 600; font-size: 60px; line-height: 1; }

/* Side panels */
.side { position: absolute; top: 78px; bottom: 78px; width: 520px; display: flex; flex-direction: column; }
.left { left: 70px; justify-content: space-between; }
.right { right: 70px; }
.glass {
  background: linear-gradient(160deg, rgba(255,255,255,.08), rgba(255,255,255,.02));
  border: 1px solid rgba(255,255,255,.12); border-radius: 22px; backdrop-filter: blur(12px);
}
.tourn { display: flex; align-items: center; gap: 22px; }
.tourn img { width: 120px; height: 120px; object-fit: contain; }
.tourn .n { font-family: Oswald; font-weight: 700; font-size: 40px; line-height: 1.05; text-transform: uppercase; }
.tourn .s { font: 600 17px Poppins; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; margin-top: 8px; }
.lab { font: 700 15px Poppins; letter-spacing: .24em; text-transform: uppercase; color: var(--dim); }
.pool { padding: 28px; }
.pool .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
.pool .k { font-family: Oswald; font-weight: 600; font-size: 64px; line-height: 1; }
.pool .k.s { background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pool .t { font: 600 14px Poppins; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); }
.meter { height: 10px; border-radius: 10px; background: rgba(255,255,255,.1); margin-top: 20px; overflow: hidden; }
.meter i { display: block; height: 100%; width: calc(var(--aa-sold-pct, 0) * 1%); background: var(--holo); border-radius: 10px; transition: width .6s; }
.spon { padding: 22px 28px; display: flex; align-items: center; gap: 22px; }
.spon img { height: 72px; width: auto; }
.spon .n { font-family: Oswald; font-weight: 600; font-size: 30px; text-transform: uppercase; line-height: 1.1; }

.brand { align-self: flex-end; width: 130px; height: 108px; object-fit: contain; }
.bid { margin: auto 0; text-align: right; }
.fig { display: flex; justify-content: flex-end; align-items: flex-end; gap: 12px; margin-top: 6px; }
.amt {
  font-family: "Bebas Neue", Impact, sans-serif; font-size: 290px; line-height: .8;
  background: linear-gradient(180deg, #fff 30%, #d8ccff); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 30px rgba(167,139,250,.55)); transform-origin: right bottom;
}
.unit { font-family: "Bebas Neue"; font-size: 100px; line-height: .9; background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 8px; }
.amt.aa-bump { animation: uc-bump .75s cubic-bezier(.2,.9,.3,1.3); }
.team { padding: 26px 28px; }
.team .top { display: flex; align-items: center; gap: 20px; }
.team img { width: 96px; height: 96px; object-fit: contain; }
.team .n { font-family: Oswald; font-weight: 700; font-size: 40px; line-height: 1.05; text-transform: uppercase; }
.team .max { display: flex; align-items: baseline; justify-content: space-between; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.12); }
.team .max .v { font-family: Oswald; font-weight: 600; font-size: 52px; line-height: 1; }

@keyframes uc-spin { to { transform: rotate(360deg); } }
@keyframes uc-foil { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }
@keyframes uc-sheen { 0%, 20% { transform: translateX(-60%); } 70%, 100% { transform: translateX(60%); } }
@keyframes uc-bump {
  0% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(167,139,250,.55)); }
  30% { transform: scale(1.1); filter: drop-shadow(0 0 60px rgba(255,122,217,.95)) brightness(1.3); }
  100% { transform: scale(1); filter: drop-shadow(0 0 30px rgba(167,139,250,.55)); }
}
</style>
</head>
<body>
<div class="aa-stage">
  <div class="rays"></div>
  <div class="floor"></div>

  <aside class="side left">
    <div class="tourn">
      <img data-src="tournament.logo" alt="">
      <div><div class="n" data-bind="tournament.name"></div><div class="s" data-bind="tournament.season"></div></div>
    </div>
    <div class="glass base"><span class="lab">Base Price</span><span class="v" data-bind="player.basePrice"></span></div>
    <div class="glass pool">
      <div class="lab">Player Pool</div>
      <div class="row">
        <div><div class="k" data-bind="status.available"></div><div class="t">Available</div></div>
        <div><div class="k s" data-bind="status.sold"></div><div class="t">Sold</div></div>
        <div><div class="k" data-bind="status.unsold"></div><div class="t">Unsold</div></div>
      </div>
      <div class="meter"><i></i></div>
    </div>
    <div class="glass spon">
      <img data-src="sponsor.logo" alt="">
      <div><div class="lab" data-bind="sponsor.label"></div><div class="n" data-bind="sponsor.name"></div></div>
    </div>
  </aside>

  <div class="card-wrap">
    <div class="card"><div class="face">
      <div class="c-side">
        <div class="c-num" data-bind="player.number"></div>
        <div class="c-grade" data-bind="player.grade"></div>
        <div class="c-role" data-bind="player.role"></div>
        <div class="c-rule"></div>
        <div class="c-age">AGE <b data-bind="player.age"></b></div>
        <div class="c-rule"></div>
        <img data-src="tournament.logo" alt="">
      </div>
      <img class="c-photo" data-src="player.photo" alt="">
      <div class="c-name" data-bind="player.name"></div>
      <div class="c-style" data-bind="player.style"></div>
      <div class="c-line"></div>
      <div class="c-stats" data-stats="player.stats">
        <template><div class="c-stat"><span class="l" data-stat="label"></span><span class="v" data-stat="value"></span></div></template>
      </div>
    </div></div>
  </div>

  <aside class="side right">
    <img class="brand" data-src="brand.logo" alt="">
    <div class="bid">
      <div class="lab">Current Bid</div>
      <div class="fig"><span class="amt" data-bind="bid.amount"></span><span class="unit" data-bind="bid.unit"></span></div>
    </div>
    <div class="glass team">
      <div class="top">
        <img data-src="team.logo" alt="">
        <div><div class="lab">Bidding Team</div><div class="n" data-bind="team.name"></div></div>
      </div>
      <div class="max"><span class="lab">Max Bid</span><span class="v" data-bind="team.maxBid"></span></div>
    </div>
  </aside>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
