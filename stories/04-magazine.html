<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auction Arena · Story 04 Magazine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,800;0,900;1,700&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="../shared/story.css">
<style>
/* Story 04 Magazine: cover-of-the-week. Cream paper, full-bleed photo, masthead, oversized surname and red cover lines. */
:root { --paper: #f3eee4; --ink: #111; --red: #e3261b; }
.aa-stage { font-family: Inter, sans-serif; color: var(--ink); background: var(--paper); }
.photo { position: absolute; left: 0; right: 0; top: 300px; height: 1060px; background-color: #cfc6b5; }
.photo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 420px; background: linear-gradient(180deg, rgba(243,238,228,0), var(--paper)); }
.mast { position: absolute; left: 60px; right: 60px; top: 110px; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 6px solid var(--ink); padding-bottom: 14px; }
.mast .t { font-family: "Playfair Display", serif; font-weight: 900; font-size: 70px; line-height: 1.05; text-transform: uppercase; letter-spacing: -1px; max-width: 760px; }
.mast img { width: 110px; height: 110px; object-fit: contain; background: var(--paper); border-radius: 50%; padding: 6px; }
.issue { position: absolute; left: 60px; top: 340px; z-index: 1; padding: 8px 14px; background: var(--red); color: #fff; font-weight: 900; font-size: 20px; letter-spacing: 4px; }
.first { position: absolute; left: 60px; right: 60px; top: 1140px; font-family: "Playfair Display", serif; font-style: italic; font-weight: 700; font-size: 72px; line-height: 1.15; }
.last { position: absolute; left: 50px; right: 40px; top: 1200px; font-family: "Playfair Display", serif; font-weight: 900; font-size: 210px; line-height: 1; text-transform: uppercase; letter-spacing: -6px; white-space: nowrap; }
.lines { position: absolute; left: 60px; right: 60px; top: 1430px; display: flex; gap: 40px; align-items: stretch; }
.lines .sold { flex: 1; border-top: 6px solid var(--red); padding-top: 14px; }
.lines small { font-size: 22px; font-weight: 900; letter-spacing: 6px; color: var(--red); }
.lines .v { font-family: "Playfair Display", serif; font-weight: 900; font-size: 100px; line-height: 1.15; margin-top: 6px; }
.lines .to { width: 300px; border-top: 6px solid var(--ink); padding-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.lines .to .r { display: flex; align-items: center; gap: 12px; font-weight: 900; font-size: 24px; text-transform: uppercase; line-height: 1.1; }
.lines .to img { width: 70px; height: 70px; object-fit: contain; }
.role { position: absolute; left: 60px; top: 1650px; font-size: 26px; font-weight: 800; letter-spacing: 6px; text-transform: uppercase; }
.foot { position: absolute; left: 60px; right: 60px; bottom: 90px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: 800; letter-spacing: 5px; border-top: 2px solid var(--ink); padding-top: 18px; }
.foot img { height: 56px; background: #111; padding: 6px 12px; border-radius: 6px; }
</style>
</head>
<body>
<div class="aa-stage" data-w="1080" data-h="1920">
  <div class="photo st-photo" data-bg="player.photo"></div>
  <div class="mast"><div class="t" data-bind="tournament.name"></div><img data-src="tournament.logo" alt=""></div>
  <div class="issue">AUCTION SPECIAL</div>
  <div class="first" data-bind="player.first"></div>
  <div class="last" data-bind="player.last"></div>
  <div class="lines">
    <div class="sold"><small>SOLD FOR</small><div class="v" data-bind="bid.points"></div></div>
    <div class="to"><small style="color:#111">SIGNED BY</small><div class="r"><img data-src="team.logo" alt=""><span data-bind="team.name"></span></div></div>
  </div>
  <div class="role" data-bind="player.role"></div>
  <div class="foot"><span>AUCTION PARTNER</span><img data-src="brand.logo" alt="Auction Arena"></div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/aa.js"></script>
<script src="../shared/story.js"></script>
</body>
</html>
