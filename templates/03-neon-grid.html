<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 03 Neon Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Neon Grid: cyberpunk HUD, perspective floor, cyan and magenta glow, clipped panels. */
:root {
  --cy: #00f0ff;
  --mg: #ff2bd6;
  --ink: #eafcff;
  --mute: rgba(170,230,255,.62);
  --panel: rgba(6,10,28,.78);
  --cut: 28px;
}
.aa-stage {
  color: var(--ink);
  font-family: Rajdhani, system-ui, sans-serif;
  background:
    radial-gradient(900px 500px at 50% 62%, rgba(255,43,214,.22), transparent 70%),
    radial-gradient(1200px 500px at 50% 0%, rgba(0,240,255,.12), transparent 70%),
    linear-gradient(180deg, #03020c 0%, #0a0424 55%, #14052e 62%, #04020c 100%);
}
/* Perspective grid floor */
.floor { position: absolute; left: -50%; right: -50%; bottom: -120px; height: 620px; transform: perspective(520px) rotateX(62deg); transform-origin: 50% 0; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 40%); mask-image: linear-gradient(180deg, transparent, #000 40%); }
.floor::before { content: ""; position: absolute; inset: -80px 0 0;
  background:
    repeating-linear-gradient(90deg, rgba(0,240,255,.55) 0 2px, transparent 2px 80px),
    repeating-linear-gradient(0deg, rgba(255,43,214,.55) 0 2px, transparent 2px 80px);
  animation: run 2.4s linear infinite; }
@keyframes run { to { transform: translateY(80px); } }
.horizon { position: absolute; left: 0; right: 0; top: 574px; height: 2px; background: linear-gradient(90deg, transparent, var(--mg), var(--cy), var(--mg), transparent); box-shadow: 0 0 30px var(--mg), 0 0 60px var(--mg); }
/* Scanlines over everything */
.aa-stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 20;
  background: repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 1px, transparent 1px 4px); }

.panel {
  position: absolute; background: var(--panel);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  backdrop-filter: blur(6px);
}
/* Neon outline following the clipped shape */
.panel::before { content: ""; position: absolute; inset: 0; padding: 2px; background: linear-gradient(135deg, var(--cy), transparent 40%, transparent 60%, var(--mg));
  clip-path: inherit; -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.tag { display: block; font: 700 17px/1 Orbitron, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--cy); }
.tag::before { content: "// "; color: var(--mg); }

/* Header */
.hdr { left: 40px; right: 40px; top: 30px; height: 118px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 40px; z-index: 5; }
.tourn { display: flex; align-items: center; gap: 22px; }
.tourn img { width: 86px; height: 86px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(0,240,255,.45)); }
.tourn .nm { display: block; font: 800 30px/1.05 Orbitron, sans-serif; letter-spacing: .02em; text-transform: uppercase; }
.tourn .ss { display: block; margin-top: 8px; font: 600 22px/1 Rajdhani, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--mg); }
.brand { position: relative; padding: 0 40px; }
.brand img { height: 96px; width: 116px; object-fit: contain; filter: drop-shadow(0 0 10px var(--cy)); }
.spons { justify-self: end; display: flex; align-items: center; gap: 24px; text-align: right; }
.spons .nm { display: block; margin-top: 8px; font: 700 30px/1 Rajdhani, sans-serif; letter-spacing: .06em; text-transform: uppercase; }
.spons img { height: 80px; width: 200px; object-fit: contain; }

/* Center stage player */
.ring { position: absolute; left: 660px; top: 170px; width: 600px; height: 600px; border-radius: 50%; z-index: 1;
  background: conic-gradient(from 0deg, var(--cy), transparent 25%, var(--mg) 50%, transparent 75%, var(--cy));
  -webkit-mask: radial-gradient(circle, transparent 290px, #000 292px, #000 296px, transparent 298px); mask: radial-gradient(circle, transparent 290px, #000 292px, #000 296px, transparent 298px);
  animation: spin 14s linear infinite; filter: drop-shadow(0 0 12px var(--cy)); }
.ring2 { position: absolute; left: 700px; top: 210px; width: 520px; height: 520px; border-radius: 50%; border: 1px dashed rgba(0,240,255,.35); z-index: 1; animation: spin 30s linear infinite reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.photo { position: absolute; left: 610px; top: 160px; width: 700px; height: 640px; object-fit: contain; object-position: center bottom; z-index: 2;
  filter: drop-shadow(0 0 2px var(--cy)) drop-shadow(0 0 30px rgba(255,43,214,.45));
  -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent); mask-image: linear-gradient(180deg, #000 80%, transparent); }
.name { position: absolute; left: 600px; width: 720px; top: 740px; text-align: center; z-index: 3; }
.name .first { display: block; font: 600 34px/1 Rajdhani, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: var(--cy); text-shadow: 0 2px 10px #000, 0 0 16px rgba(0,0,0,.9); }
.name .last { display: block; margin-top: 6px; font: 900 108px/1 Orbitron, sans-serif; text-transform: uppercase; letter-spacing: .02em;
  text-shadow: 0 0 18px rgba(255,43,214,.8), 0 0 40px rgba(255,43,214,.45); }
.chips { position: absolute; left: 600px; width: 720px; top: 928px; display: flex; justify-content: center; gap: 14px; z-index: 3; }
.chip { --cut: 12px; position: relative; display: inline-flex; align-items: center; gap: 10px; height: 54px; padding: 0 26px; background: rgba(6,10,28,.85);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  font: 700 24px/1 Rajdhani, sans-serif; letter-spacing: .12em; text-transform: uppercase; box-shadow: inset 0 0 0 2px rgba(0,240,255,.5); }
.chip small { font-size: 16px; color: var(--mute); }
.chip.hot { background: var(--mg); color: #12001a; box-shadow: none; font-family: Orbitron, sans-serif; font-weight: 900; font-size: 20px; }
.chips .style { position: absolute; top: 70px; left: 0; right: 0; text-align: center; font: 600 22px/1 Rajdhani, sans-serif; letter-spacing: .12em; color: var(--mute); text-transform: uppercase; }

/* Left: stats HUD */
.statsp { left: 40px; top: 178px; width: 540px; height: 866px; padding: 36px 36px 30px; z-index: 5; display: flex; flex-direction: column; }
.stats { flex: 1; margin-top: 20px; display: flex; flex-direction: column; justify-content: space-between; }
.stat { display: flex; align-items: center; justify-content: space-between; height: 80px; padding: 0 22px; position: relative;
  background: linear-gradient(90deg, rgba(0,240,255,.1), transparent 70%); border-left: 3px solid var(--cy); }
.stat:nth-child(even) { border-left-color: var(--mg); background: linear-gradient(90deg, rgba(255,43,214,.1), transparent 70%); }
.stat .v { order: 2; font: 800 42px/1 Orbitron, sans-serif; font-variant-numeric: tabular-nums; }
.stat .l { order: 1; font: 700 22px/1 Rajdhani, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }

/* Right: bid, team, status */
.bidp { left: 1340px; top: 178px; width: 540px; height: 430px; padding: 34px 36px; z-index: 5; --cut: 36px;
  background: linear-gradient(160deg, rgba(0,240,255,.14), rgba(6,10,28,.85) 50%, rgba(255,43,214,.18)); }
.bidp .row { display: flex; justify-content: space-between; align-items: center; }
.live { display: inline-flex; align-items: center; gap: 10px; font: 800 18px/1 Orbitron, sans-serif; letter-spacing: .2em; color: #fff; background: var(--mg); padding: 8px 14px; }
.live i { width: 10px; height: 10px; background: #fff; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.basep { font: 600 22px/1 Rajdhani, sans-serif; letter-spacing: .1em; color: var(--mute); text-transform: uppercase; }
.basep span { color: var(--ink); }
.bidbox { margin-top: 30px; text-align: center; position: relative; }
.bidbox .val { display: block; font: 900 188px/1 Orbitron, sans-serif; letter-spacing: -.02em; font-variant-numeric: tabular-nums; color: #fff;
  text-shadow: 0 0 6px #fff, 0 0 22px var(--cy), 0 0 60px var(--cy), 0 0 110px rgba(0,240,255,.6); }
.bidbox .unitrow { display: flex; justify-content: center; align-items: center; gap: 18px; margin-top: 10px; }
.bidbox .rs, .bidbox .unit { font: 900 64px/1 Orbitron, sans-serif; color: var(--mg); text-shadow: 0 0 20px rgba(255,43,214,.8); }
.bidbox .unitrow::before, .bidbox .unitrow::after { content: ""; flex: 1; height: 2px; background: linear-gradient(90deg, transparent, var(--mg)); }
.bidbox .unitrow::after { background: linear-gradient(90deg, var(--mg), transparent); }
/* Scanline shimmer sweeping over the bid */
.bidbox::after { content: ""; position: absolute; left: 0; right: 0; top: -40%; height: 30%; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(0,240,255,.22), transparent); animation: scan 3.2s linear infinite; }
@keyframes scan { to { top: 110%; } }
.bidbox .val.aa-bump { animation: glitch .6s steps(1) , neon-bump .6s ease-out; }
@keyframes neon-bump { 0% { transform: scale(1); } 30% { transform: scale(1.1); filter: brightness(1.5); } 100% { transform: scale(1); } }
@keyframes glitch {
  0% { text-shadow: -6px 0 var(--mg), 6px 0 var(--cy), 0 0 60px var(--cy); }
  33% { text-shadow: 6px 0 var(--mg), -6px 0 var(--cy), 0 0 90px #fff; }
  66% { text-shadow: -3px 0 var(--mg), 3px 0 var(--cy), 0 0 60px var(--cy); }
}

.teamp { left: 1340px; top: 630px; width: 540px; height: 250px; padding: 30px 36px; z-index: 5; display: grid; grid-template-columns: 130px 1fr; grid-template-rows: auto 1fr; column-gap: 24px; }
.teamp .tag { grid-column: 1 / -1; margin-bottom: 18px; }
.teamp img { width: 130px; height: 130px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(0,240,255,.4)); }
.teamp .nm { display: block; font: 800 30px/1.1 Orbitron, sans-serif; text-transform: uppercase; }
.teamp .max { margin-top: 14px; display: flex; align-items: baseline; gap: 14px; font: 700 20px/1 Rajdhani, sans-serif; letter-spacing: .16em; text-transform: uppercase; color: var(--mute); }
.teamp .max span[data-bind] { font: 900 46px/1 Orbitron, sans-serif; letter-spacing: 0; color: var(--cy); text-shadow: 0 0 16px rgba(0,240,255,.7); }
.teamp .mini { margin-top: 12px; font: 600 20px/1 Rajdhani, sans-serif; letter-spacing: .1em; color: var(--mute); text-transform: uppercase; }
.teamp .mini b { color: var(--ink); }

.statusp { left: 1340px; top: 902px; width: 540px; height: 142px; padding: 22px 36px; z-index: 5; }
.statusp .cols { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; }
.statusp .c { display: flex; flex-direction: column; }
.statusp .c span[data-bind] { font: 900 40px/1 Orbitron, sans-serif; }
.statusp .c.sold span[data-bind] { color: var(--mg); text-shadow: 0 0 14px rgba(255,43,214,.7); }
.statusp .c small { margin-top: 4px; font: 700 16px/1 Rajdhani, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.statusp .bar { position: absolute; left: 36px; right: 36px; bottom: 18px; height: 6px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 10px, transparent 10px 14px); }
.statusp .bar i { display: block; height: 100%; width: calc(var(--aa-sold-pct, 0) * 1%); background: repeating-linear-gradient(90deg, var(--mg) 0 10px, transparent 10px 14px); filter: drop-shadow(0 0 6px var(--mg)); transition: width .8s ease; }
</style>
</head>
<body>
<div class="aa-stage">
  <div class="floor"></div>
  <div class="horizon"></div>

  <div class="panel hdr">
    <div class="tourn">
      <img data-src="tournament.logo" alt="">
      <div><span class="nm" data-bind="tournament.name"></span><span class="ss" data-bind="tournament.season"></span></div>
    </div>
    <div class="brand"><img data-src="brand.logo" alt=""></div>
    <div class="spons">
      <div><span class="tag" data-bind="sponsor.label"></span><span class="nm" data-bind="sponsor.name"></span></div>
      <img data-src="sponsor.logo" alt="">
    </div>
  </div>

  <div class="panel statsp">
    <span class="tag">Player Data</span>
    <div class="stats" data-stats="player.stats">
      <template><div class="stat"><span class="v" data-stat="value"></span><span class="l" data-stat="label"></span></div></template>
    </div>
  </div>

  <div class="ring"></div>
  <div class="ring2"></div>
  <img class="photo" data-src="player.photo" alt="">
  <div class="name">
    <span class="first" data-bind="player.first"></span>
    <span class="last" data-bind="player.last"></span>
  </div>
  <div class="chips">
    <span class="chip hot" data-bind="player.grade"></span>
    <span class="chip"><small>Age</small><span data-bind="player.age"></span></span>
    <span class="chip"><small>Role</small><span data-bind="player.role"></span></span>
  </div>

  <div class="panel bidp">
    <div class="row">
      <span class="live"><i></i>LIVE BID</span>
      <span class="basep">Base <span data-bind="player.basePrice"></span></span>
    </div>
    <div class="bidbox">
      <span class="val" data-bind="bid.amount"></span>
      <div class="unitrow"><span class="rs">₹</span><span class="unit" data-bind="bid.unit"></span></div>
    </div>
  </div>

  <div class="panel teamp">
    <span class="tag">Bidding Team</span>
    <img data-src="team.logo" alt="">
    <div>
      <span class="nm" data-bind="team.name"></span>
      <div class="max">Max Bid <span data-bind="team.maxBid"></span></div>
      <div class="mini">Purse <b data-bind="team.purse"></b> · Slots <b data-bind="team.slots"></b></div>
    </div>
  </div>

  <div class="panel statusp">
    <span class="tag">Auction Pool</span>
    <div class="cols">
      <div class="c"><span data-bind="status.available"></span><small>Available</small></div>
      <div class="c sold"><span data-bind="status.sold"></span><small>Sold</small></div>
      <div class="c"><span data-bind="status.unsold"></span><small>Unsold</small></div>
    </div>
    <div class="bar"><i></i></div>
  </div>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
