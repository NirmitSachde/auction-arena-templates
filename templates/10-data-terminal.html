<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Auction Arena · 10 Data Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/base.css">
<style>
/* Data Terminal: Swiss grid, graphite + signal orange, monospace figures. */
div[data-bind] { display: block; }
:root {
  --bg: #121417;
  --panel: #1a1d21;
  --panel2: #202429;
  --line: rgba(255,255,255,.09);
  --line2: rgba(255,255,255,.16);
  --ink: #f2f3f5;
  --mute: #8b929c;
  --sig: #ff5a1f;
  --sig2: #ff8a3d;
  --ok: #3ddc97;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --sans: "Inter Tight", "Inter", system-ui, sans-serif;
}
.aa-stage {
  font-family: var(--sans);
  color: var(--ink);
  background:
    radial-gradient(1200px 700px at 78% 30%, rgba(255,90,31,.10), transparent 60%),
    linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 40px 40px,
    var(--bg);
  padding: 44px 48px;
  display: grid;
  grid-template-rows: 76px 1fr 44px;
  gap: 22px;
}
.aa-stage::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(closest-side at 50% 50%, transparent 70%, rgba(0,0,0,.55));
}
.mono { font-family: var(--mono); }
.lbl { font-family: var(--mono); font-size: 15px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; color: var(--mute); }
.lbl b { color: var(--sig); font-weight: 700; }

/* Header */
.hdr { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 40px; border-bottom: 2px solid var(--line2); padding-bottom: 14px; position: relative; z-index: 1; }
.hdr::after { content: ""; position: absolute; left: 0; bottom: -2px; width: 220px; height: 2px; background: var(--sig); }
.tour { display: flex; align-items: center; gap: 20px; }
.tour img { width: 62px; height: 62px; }
.tour-name { font-size: 34px; font-weight: 800; letter-spacing: -.01em; line-height: 1; }
.tour-season { margin-top: 6px; }
.spon { display: flex; align-items: center; gap: 16px; padding-right: 40px; border-right: 1px solid var(--line2); }
.spon img { height: 58px; width: 155px; object-fit: contain; }
.spon .t { text-align: right; }
.spon .n { font-size: 22px; font-weight: 700; margin-top: 4px; }
.brand img { height: 70px; width: 84px; object-fit: contain; }

/* Main grid */
.main { display: grid; grid-template-columns: 500px 1fr 600px; gap: 22px; min-height: 0; position: relative; z-index: 1; }
.panel { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line2); position: relative; }
.ph { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }

/* Col 1: subject */
.subj { display: grid; grid-template-rows: auto 1fr auto; }
.photo { position: relative; overflow: hidden;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 24px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 24px),
    radial-gradient(60% 55% at 50% 60%, rgba(255,90,31,.22), transparent 70%);
}
.photo img { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 100%; width: auto; max-width: none; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
.photo .c { position: absolute; width: 34px; height: 34px; border: 3px solid var(--sig); }
.photo .c1 { top: 18px; left: 18px; border-right: 0; border-bottom: 0; }
.photo .c2 { top: 18px; right: 18px; border-left: 0; border-bottom: 0; }
.photo .c3 { bottom: 18px; left: 18px; border-right: 0; border-top: 0; }
.photo .c4 { bottom: 18px; right: 18px; border-left: 0; border-top: 0; }
.photo .scan { position: absolute; left: 0; right: 0; height: 120px; top: -120px;
  background: linear-gradient(180deg, transparent, rgba(255,90,31,.14), transparent);
  animation: scan 5s linear infinite; }
@keyframes scan { to { top: 100%; } }
.photo .tag { position: absolute; top: 26px; left: 64px; font-family: var(--mono); font-size: 14px; letter-spacing: .16em; color: var(--sig); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line2); }
.facts > div { padding: 16px 20px; border-right: 1px solid var(--line); }
.facts > div:last-child { border-right: 0; }
.facts .v { font-size: 34px; font-weight: 800; margin-top: 6px; line-height: 1.05; }
.facts .grade .v { color: var(--sig); }

/* Col 2: identity + stats */
.core { display: grid; grid-template-rows: auto 1fr; gap: 22px; min-height: 0; }
.ident { padding: 22px 30px 26px; }
.ident .first { font-size: 40px; font-weight: 500; color: var(--mute); line-height: 1; margin-top: 12px; }
.ident .last { font-size: 128px; font-weight: 900; letter-spacing: -.035em; line-height: .9; text-transform: uppercase; margin-top: 4px; }
.ident .style { margin-top: 14px; font-family: var(--mono); font-size: 18px; color: #c9ced6; letter-spacing: .02em; }
.ident .style::before { content: "> "; color: var(--sig); }
.stats-p { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
.stats { display: grid; grid-template-rows: repeat(8, 1fr); padding: 4px 0; }
.row { display: grid; grid-template-columns: 70px 1fr 190px 190px; align-items: center; padding: 0 28px 0 20px; border-bottom: 1px solid var(--line);
  opacity: 0; animation: rowin .6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 80ms + 200ms); }
.row:last-child { border-bottom: 0; }
@keyframes rowin { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
.row::before { content: counter(st, decimal-leading-zero); counter-increment: st; font-family: var(--mono); font-size: 15px; color: var(--mute); }
.stats { counter-reset: st; }
.row .l { font-size: 22px; font-weight: 600; color: #d6dae0; order: 1; }
.row .bar { order: 2; height: 10px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.1) 0 8px, transparent 8px 11px); position: relative; overflow: hidden; }
.row .bar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, var(--sig) 0 8px, transparent 8px 11px);
  transform-origin: left; transform: scaleX(0); animation: fill 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--i) * 80ms + 500ms);
  -webkit-mask: linear-gradient(90deg, rgba(0,0,0,.35), #000); mask: linear-gradient(90deg, rgba(0,0,0,.35), #000); }
@keyframes fill { to { transform: scaleX(1); } }
.row .v { order: 3; text-align: right; font-family: var(--mono); font-weight: 700; font-size: 38px; letter-spacing: -.02em; }

/* Col 3: bid + team + status */
.side { display: grid; grid-template-rows: auto auto 1fr; gap: 22px; min-height: 0; }
.bid { border-color: rgba(255,90,31,.55); background:
  linear-gradient(180deg, rgba(255,90,31,.16), rgba(255,90,31,.03) 70%),
  var(--panel); overflow: hidden; }
.bid::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px; background: var(--sig); }
.bid .ph { border-color: rgba(255,90,31,.25); }
.live { display: inline-flex; align-items: center; gap: 10px; color: var(--sig); font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: .18em; }
.live i { width: 12px; height: 12px; border-radius: 50%; background: var(--sig); box-shadow: 0 0 14px var(--sig); animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.bid-body { padding: 10px 30px 22px 38px; display: flex; align-items: baseline; gap: 14px; }
.amt { font-family: var(--mono); font-weight: 800; font-size: 200px; line-height: 1; letter-spacing: -.06em; color: #fff;
  text-shadow: 0 0 60px rgba(255,90,31,.45); }
.amt.aa-bump { animation: tbump .7s cubic-bezier(.2,.9,.3,1.2); }
@keyframes tbump {
  0% { color: #fff; transform: translateY(0); }
  20% { color: var(--sig2); transform: translateY(-10px); text-shadow: 0 0 90px rgba(255,90,31,.9); }
  100% { color: #fff; transform: translateY(0); }
}
.unit { font-family: var(--mono); font-size: 64px; font-weight: 800; color: var(--sig); }
.bid-foot { display: flex; gap: 0; border-top: 1px solid rgba(255,90,31,.25); }
.bid-foot > div { flex: 1; padding: 12px 20px 14px 38px; }
.bid-foot > div + div { border-left: 1px solid rgba(255,90,31,.2); padding-left: 20px; }
.bid-foot .v { font-family: var(--mono); font-size: 28px; font-weight: 700; margin-top: 4px; }

.team-b { display: grid; grid-template-columns: 112px 1fr; gap: 20px; align-items: center; padding: 18px 22px; }
.team-b img { width: 112px; height: 112px; }
.team-name { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -.01em; margin-top: 6px; }
.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.team-grid > div { padding: 12px 22px 14px; border-right: 1px solid var(--line); }
.team-grid > div:last-child { border-right: 0; }
.team-grid .v { font-family: var(--mono); font-size: 30px; font-weight: 700; margin-top: 4px; }
.team-grid .max .v { color: var(--sig); }

.status { display: grid; grid-template-rows: auto 1fr auto; }
.st-nums { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; padding: 0 22px; }
.st-nums .v { font-family: var(--mono); font-size: 48px; font-weight: 800; line-height: 1; margin-top: 6px; }
.st-nums .sold .v { color: var(--ok); }
.st-nums .uns .v { color: var(--mute); }
.prog { padding: 0 22px 18px; }
.track { height: 12px; background: rgba(255,255,255,.08); position: relative; overflow: hidden; }
.track i { position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--aa-sold-pct, 0) * 1%); background: linear-gradient(90deg, var(--ok), #9cf5cc); transition: width .8s ease; }
.track::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), var(--bg) calc(10% - 2px) 10%); }
.prog .lbl { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }

/* Footer */
.ftr { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line2); font-family: var(--mono); font-size: 14px; letter-spacing: .18em; color: var(--mute); text-transform: uppercase; position: relative; z-index: 1; }
.ftr span b { color: var(--sig); }
</style>
</head>
<body>
<div class="aa-stage">
  <header class="hdr">
    <div class="tour">
      <img data-src="tournament.logo" alt="">
      <div>
        <div class="tour-name" data-bind="tournament.name"></div>
        <div class="tour-season lbl" data-bind="tournament.season"></div>
      </div>
    </div>
    <div class="spon">
      <div class="t">
        <div class="lbl" data-bind="sponsor.label"></div>
        <div class="n" data-bind="sponsor.name"></div>
      </div>
      <img data-src="sponsor.logo" alt="">
    </div>
    <div class="brand"><img data-src="brand.logo" alt=""></div>
  </header>

  <main class="main">
    <section class="panel subj">
      <div class="ph"><span class="lbl"><b>01</b> / Subject</span><span class="lbl">#<span data-bind="player.number"></span></span></div>
      <div class="photo">
        <img data-src="player.photo" alt="">
        <div class="scan"></div>
        <i class="c c1"></i><i class="c c2"></i><i class="c c3"></i><i class="c c4"></i>
        <div class="tag">LOT IN PLAY</div>
      </div>
      <div class="facts">
        <div class="grade"><div class="lbl">Grade</div><div class="v" data-bind="player.grade"></div></div>
        <div><div class="lbl">Age</div><div class="v mono" data-bind="player.age"></div></div>
        <div><div class="lbl">Role</div><div class="v" data-bind="player.role"></div></div>
      </div>
    </section>

    <section class="core">
      <div class="panel ident">
        <div class="lbl"><b>02</b> / Player</div>
        <div class="first" data-bind="player.first"></div>
        <div class="last" data-bind="player.last"></div>
        <div class="style" data-bind="player.style"></div>
      </div>
      <div class="panel stats-p">
        <div class="ph"><span class="lbl"><b>03</b> / Career Metrics</span><span class="lbl">Base <span data-bind="player.basePrice"></span></span></div>
        <div class="stats" data-stats="player.stats"><template><div class="row"><span class="v" data-stat="value"></span><span class="l" data-stat="label"></span><span class="bar"></span></div></template></div>
      </div>
    </section>

    <section class="side">
      <div class="panel bid">
        <div class="ph"><span class="lbl"><b>04</b> / Current Bid</span><span class="live"><i></i>LIVE</span></div>
        <div class="bid-body"><span class="amt" data-bind="bid.amount"></span><span class="unit" data-bind="bid.unit"></span></div>
      </div>
      <div class="panel team">
        <div class="team-b">
          <img data-src="team.logo" alt="">
          <div><div class="lbl">Bidding Team</div><div class="team-name" data-bind="team.name"></div></div>
        </div>
        <div class="team-grid">
          <div class="max"><div class="lbl">Max Bid</div><div class="v" data-bind="team.maxBid"></div></div>
          <div><div class="lbl">Purse</div><div class="v" data-bind="team.purse"></div></div>
          <div><div class="lbl">Slots</div><div class="v" data-bind="team.slots"></div></div>
        </div>
      </div>
      <div class="panel status">
        <div class="ph"><span class="lbl"><b>05</b> / Pool Status</span></div>
        <div class="st-nums">
          <div><div class="lbl">Available</div><div class="v" data-bind="status.available"></div></div>
          <div class="sold"><div class="lbl">Sold</div><div class="v" data-bind="status.sold"></div></div>
          <div class="uns"><div class="lbl">Unsold</div><div class="v" data-bind="status.unsold"></div></div>
        </div>
        <div class="prog"><div class="track"><i></i></div><div class="lbl"><span>Sold progress</span><span><span data-bind="status.sold"></span> / <span data-bind="status.available"></span></span></div></div>
      </div>
    </section>
  </main>

  <footer class="ftr">
    <span><b>■</b> Auction Feed · <span data-bind="brand.name"></span></span>
    <span data-bind="tournament.season"></span>
  </footer>
</div>
<script src="../shared/data.js"></script><script src="../shared/aa.js"></script>
</body>
</html>
